<!-- Clickable stat/value cells use the keyActivate directive (pipes/key-activate.directive.ts)
     for keyboard operation. These two a11y rules are static and can't see the directive, so they
     false-positive on every element that uses it — disabled file-wide here, still enforced elsewhere. -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<!-- The label is a joined caption on the field's left, the way the Nv / Job pair in the band
     above reads (.joined_field lives in ro-calculator.component.css, which this component's
     styleUrls pull in), with the "+N" equipment bonus outside the control. -->
<div class="status_input">
  <div class="joined_field">
    <label class="joined_caption status_label" [attr.for]="label">{{ label }}</label>
    <p-dropdown
      [disabled]="disabled"
      inputId="{{ label }}"
      [autoDisplayFirst]="false"
      [options]="dropdownList"
      [filter]="true"
      filterBy="label"
      scrollHeight="350px"
      [resetFilterOnHide]="true"
      [(ngModel)]="value"
      (onChange)="onBaseStatusChange()"
      emptyFilterMessage=""
    >
      <ng-template pTemplate="filtericon"> </ng-template>
    </p-dropdown>
  </div>
  <span
    *ngIf="showExtra"
    class="status_extra"
    [class]="badgeSeverity === 'info' ? 'text-cyan-300' : 'text-yellow-400'"
    [class.bonus_clickable]="isExtraClickable"
    [keyActivate]="isExtraClickable"
    (click)="isExtraClickable && extraClick.emit()"
    >+{{ extraValue }}</span
  >
</div>
