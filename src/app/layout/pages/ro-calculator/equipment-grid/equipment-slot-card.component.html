<div class="eq-card" [class.eq-card--tinted]="!!color" [style.--slot-color-rgb]="color?.rgb">
  <div class="eq-card__head">
    <!-- Ahead of the slot name, where it reads as a property of the card rather than as a
         third action next to Comparar and ✕. Always drawn, greyed out on an empty slot:
         hiding it left a hole that pulled the neighbouring slot names out of line, and the
         disabled state is where the tooltip explains what to do first. Not the `disabled`
         attribute, which would stop the tooltip firing — the guard is in onPickColor, the
         same way the compare button handles an occupied slot. -->
    <button
      #colorAnchor
      type="button"
      class="eq-card__color"
      [class.eq-card__color--idle]="!colorable"
      [attr.aria-label]="colorTitle"
      [appTooltip]="colorTitle"
      tooltipPosition="top"
      [showDelay]="300"
      (click)="onPickColor(colorAnchor)"
    >
      <span class="eq-card__color-dot" [class.eq-card__color-dot--empty]="!color" [style.background]="color?.hex"></span>
    </button>

    <!-- Shown on one card only, and only until the button has been opened once. The timing
         is the animation's: it waits for the grid to finish drawing, lingers, and fades out
         on its own. Nothing in TypeScript counts the seconds. -->
    <span class="eq-card__color-hint" *ngIf="colorHint && colorable && !hintDismissed">Marque este slot com uma cor</span>

    <span class="eq-card__label">{{ descriptor.label }}</span>
    <span
      *ngIf="item?.preRelease"
      class="pre_release_tag"
      appTooltip="Prévia: item ainda não lançado no LATAM — nome e descrição em inglês, do kRO/iRO (divine-pride)."
      tooltipPosition="top"
      [showDelay]="300"
      >Prévia</span
    >
    <span class="eq-card__spacer"></span>

    <button
      *ngIf="comparable"
      type="button"
      class="eq-card__compare"
      [class.eq-card__compare--on]="comparingHere"
      [class.eq-card__compare--locked]="!!occupiedBy"
      [attr.aria-pressed]="comparingHere"
      [appTooltip]="compareTitle"
      tooltipPosition="top"
      [showDelay]="300"
      (click)="onToggleCompare()"
    >
      <app-icon *ngIf="occupiedBy" name="lock" style="font-size: 11px"></app-icon>
      <span *ngIf="!occupiedBy" aria-hidden="true">⇄</span>
      {{ comparingHere ? 'Comparando' : 'Comparar' }}
    </button>

    <button
      *ngIf="hasContent"
      type="button"
      class="eq-card__clear"
      aria-label="Limpar slot"
      appTooltip="Limpar slot"
      tooltipPosition="top"
      [showDelay]="300"
      (click)="clearSlot.emit()"
    >
      ✕
    </button>
  </div>

  <!-- Filled by a multi-slot head gear worn elsewhere: nothing to choose here, and the
       cards and enchants belong to whichever slot actually holds the item. -->
  <div class="eq-card__occupied" *ngIf="occupiedBy">{{ occupiedBy }} (ocupado)</div>

  <ng-container *ngIf="!occupiedBy">
    <ng-container
      *ngTemplateOutlet="body; context: { rows: mainRows, entry: item, compare: false }"
    ></ng-container>

    <!-- The sub-row has no header of its own, so its buttons sit over the top-right corner
         where the card's own does. The ✕ empties the alternative without switching the
         comparison off: with the slot compared and nothing in it, the card answers "and
         what if I took this off", which the toggle cannot ask. The ⇅ trades the two sides,
         so the alternative that won can be kept without being picked again — and the one
         it displaced stays compared, one more click from coming back. -->
    <div class="eq-card__compare-row" *ngIf="compareRows.length">
      <div class="eq-card__compare-actions">
        <button
          *ngIf="canSwap"
          type="button"
          class="eq-card__clear eq-card__clear--compare"
          aria-label="Inverter: trocar este item pelo comparado"
          appTooltip="Inverter: o item comparado passa a ser o da build, e o da build passa a ser o comparado"
          tooltipPosition="left"
          [showDelay]="300"
          (click)="swapCompare.emit()"
        >
          ⇅
        </button>

        <button
          *ngIf="hasCompareContent"
          type="button"
          class="eq-card__clear eq-card__clear--compare"
          aria-label="Limpar a comparação deste slot"
          appTooltip="Limpar a comparação deste slot"
          tooltipPosition="left"
          [showDelay]="300"
          (click)="clearCompare.emit()"
        >
          ✕
        </button>
      </div>
      <ng-container *ngTemplateOutlet="body; context: { rows: compareRows, entry: compareItem, compare: true }"></ng-container>
    </div>
  </ng-container>
</div>

<ng-template #body let-rows="rows" let-entry="entry" let-compare="compare">
  <div class="eq-card__body">
    <span
      class="eq-card__icon"
      [class.eq-card__icon--compare]="compare"
      [appTooltip]="entry ? (entry.id | itemDescTooltip: items : itemDescriptions.version) : ''"
      [escape]="false"
      tooltipPosition="top"
      [showDelay]="350"
      tooltipStyleClass="item_desc_tooltip"
    >
      <img *ngIf="entry" [src]="entry.id | iconUrl: 'item'" alt="" loading="lazy" missingIcon />
    </span>

    <div class="eq-card__chips">
      <div class="eq-card__line" *ngFor="let row of rows; trackBy: trackIndex">
        <app-equipment-chip
          *ngFor="let view of row; trackBy: trackChip"
          [view]="view"
          [items]="items"
          [compare]="compare"
          (pick)="onChipPick(view, $event, compare)"
          (edit)="onChipEdit($event)"
          (clear)="onChipClear(view, compare)"
        ></app-equipment-chip>
      </div>
    </div>
  </div>
</ng-template>
