name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

# Two overlapping runs would race to activate different asset manifests. Serialising is
# free, and matters more now that this workflow also ships the MCP server.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so the post-deploy step can compare package.json against
          # the pre-push commit (github.event.before) to detect a version bump
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Source and template checks
        run: pnpm lint:check && pnpm typecheck

      # The MCP server ships inside the Worker now, so this workflow inherits the gate
      # that mcp-deploy.yml used to provide — including the parity spec, which pins
      # absolute damage numbers through the whole engine.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Assets plus a Worker on two routes (share links and the MCP server), configured by
      # wrangler.jsonc. wrangler uploads the contents of dist/sakai-ng and the pre-bundled
      # Worker from dist/worker; cache policy for the assets travels with them in
      # dist/sakai-ng/_headers.
      - name: Install deployment tools
        run: pnpm --dir tooling/cloudflare install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:worker

      # Lifted from the retired mcp-deploy.yml. A green wrangler deploy says the script
      # uploaded, not that the dataset it reads through the ASSETS binding actually parses
      # — which is the one thing that can break here without a build error.
      - name: Verify the MCP server
        run: |
          BASE=https://simulador.latam-tools.com.br
          for i in $(seq 1 10); do
            if curl -fsS "$BASE/mcp/healthz" | grep -q '"ok":true'; then break; fi
            echo "waiting for /mcp/healthz ($i/10)"
            sleep 3
          done
          curl -fsS "$BASE/mcp/healthz" | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS -X POST "$BASE/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"calculate"'

      # Announce the release in Discord — only when this push actually bumped the
      # version (so routine main pushes don't spam #novidades). Runs after a
      # successful deploy; a missing DISCORD_BOT_TOKEN secret is a no-op.
      - name: Detect version bump
        id: ver
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          OLD=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE:package.json" 2>/dev/null; then
            OLD=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          fi
          echo "New version: $NEW / previous: ${OLD:-<none>}"
          if [ "$NEW" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Post novidades to Discord
        if: steps.ver.outputs.changed == 'true'
        # best-effort: the deploy already shipped, so a Discord hiccup (perms,
        # outage) shouldn't fail the run — it's still logged as a failed step.
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1524025278471471295"
        run: node tools/post-novidades.mjs
