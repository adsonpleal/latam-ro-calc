name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

# Two overlapping runs would race to activate different asset manifests. Serialising is
# free; same pattern as mcp-deploy.yml.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so the post-deploy step can compare package.json against
          # the pre-push commit (github.event.before) to detect a version bump
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # bun auto-enables --frozen-lockfile in CI; the committed bun.lock drifts from
        # package.json, so allow bun to reconcile it instead of failing the run.
        run: bun install --no-frozen-lockfile

      # The Worker is bundled by wrangler itself, so nothing else typechecks it — and a
      # type error there would only surface as a failed deploy.
      - name: Typecheck the Worker
        run: bun run typecheck:worker

      - name: Build
        run: bun run build

      # Assets plus one route-scoped Worker (share links), configured by wrangler.jsonc.
      # wrangler uploads the contents of dist/sakai-ng and bundles worker/index.ts; cache
      # policy for the assets travels with them in dist/sakai-ng/_headers.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # The action infers the package manager from committed lockfiles and would pick
          # pnpm off pnpm-lock.yaml — but CI installs only bun, so the pnpm probe fails.
          # npm is always on the runner.
          packageManager: npm

      # Announce the release in Discord — only when this push actually bumped the
      # version (so routine main pushes don't spam #novidades). Runs after a
      # successful deploy; a missing DISCORD_BOT_TOKEN secret is a no-op.
      - name: Detect version bump
        id: ver
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          OLD=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE:package.json" 2>/dev/null; then
            OLD=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          fi
          echo "New version: $NEW / previous: ${OLD:-<none>}"
          if [ "$NEW" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Post novidades to Discord
        if: steps.ver.outputs.changed == 'true'
        # best-effort: the deploy already shipped, so a Discord hiccup (perms,
        # outage) shouldn't fail the run — it's still logged as a failed step.
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1524025278471471295"
        run: node tools/post-novidades.mjs
