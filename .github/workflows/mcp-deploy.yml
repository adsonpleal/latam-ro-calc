name: Deploy MCP server

# The MCP server bundles the calculator engine from src/app/** and ships the same
# data JSONs the site serves, so a change to either has to redeploy it — otherwise
# agents would compute different damage than the website.
on:
  push:
    branches:
      - main
    paths:
      - 'mcp/**'
      - 'src/app/**'
      - 'src/assets/demo/data/**'
      - 'src/environments/**'
      - '.github/workflows/mcp-deploy.yml'
  # Lets a deploy be re-run without an empty commit (e.g. after a server rebuild).
  workflow_dispatch:

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Matches firebase-deploy.yml: the committed lockfile drifts from
        # package.json, so let bun reconcile instead of failing the run.
        run: bun install --no-frozen-lockfile

      - name: Typecheck the server
        run: bun run typecheck:mcp

      # The parity spec pins the MCP facade to replay-validated absolute damage
      # (16449 / 68309 / 20571 / 117700 / 191585 / 71823). If the engine drifts from
      # what the site computes, this fails and nothing ships.
      - name: Test
        run: bun run test

      - name: Build the bundle
        run: bun run build:mcp

      - name: Package bundle + data
        run: |
          mkdir -p stage/data
          cp dist/mcp/server.mjs stage/
          for f in item.json latam-items.json monster.json latam-monsters.json \
                   hp_sp_table.json latam-classes.json; do
            cp "src/assets/demo/data/$f" stage/data/
          done
          tar -czf ro-mcp.tar.gz -C stage .
          ls -lh ro-mcp.tar.gz

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship and restart
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/deploy.pem ro-mcp.tar.gz "ubuntu@$EC2_HOST:~/"
          ssh -i ~/.ssh/deploy.pem "ubuntu@$EC2_HOST" '
            set -e
            # Extract into a staging dir first so a half-transferred archive can never
            # leave /opt/ro-mcp with a truncated bundle.
            rm -rf ~/ro-mcp-next && mkdir -p ~/ro-mcp-next
            tar -xzf ~/ro-mcp.tar.gz -C ~/ro-mcp-next
            test -s ~/ro-mcp-next/server.mjs
            test -s ~/ro-mcp-next/data/item.json
            sudo rsync -a --delete ~/ro-mcp-next/ /opt/ro-mcp/
            sudo chown -R ubuntu:ubuntu /opt/ro-mcp
            rm -rf ~/ro-mcp-next ~/ro-mcp.tar.gz
            sudo systemctl restart ro-mcp
          '

      - name: Verify
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://mcp.simulador.latam-tools.com.br/healthz || true)
            [ "$code" = "200" ] && break
            echo "healthz -> $code, retry $i"; sleep 3
          done
          curl -sf https://mcp.simulador.latam-tools.com.br/healthz | tee /dev/stderr | grep -q '"ok":true'

          # A real tool call, so a bundle that boots but cannot calculate still fails.
          curl -sf -X POST https://mcp.simulador.latam-tools.com.br/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"calculate"'

          ssh -i ~/.ssh/deploy.pem "ubuntu@$EC2_HOST" 'journalctl -u ro-mcp --no-pager -n 15'
